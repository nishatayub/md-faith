<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <title id="t">MD-Faith pipeline</title>
  <desc id="d">A trajectory passes a QC gate and ground-truth computation. An AI explanation is split into claims, verified against ground truth and returned as an evidence-linked report.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6a64"/></marker>
  </defs>
  <rect width="960" height="330" rx="14" fill="#f4f6fa"/>
  <g font-size="15" font-weight="700" fill="#0b0b0b">
    <g><rect x="28" y="36" width="190" height="74" rx="10" fill="#ffffff" stroke="#c3c2b7"/><text x="123" y="68" text-anchor="middle">1 Trajectory</text><text x="123" y="90" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">public systems only</text></g>
    <g><rect x="285" y="36" width="190" height="74" rx="10" fill="#fff6dc" stroke="#e0b341"/><text x="380" y="68" text-anchor="middle">2 QC gate</text><text x="380" y="90" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">wrapping · fitting · frame order</text></g>
    <g><rect x="542" y="36" width="190" height="74" rx="10" fill="#ffffff" stroke="#c3c2b7"/><text x="637" y="68" text-anchor="middle">3 Ground truth</text><text x="637" y="90" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">RMSD · RMSF · Rg · contacts · H-bonds</text></g>
    <g><rect x="742" y="36" width="190" height="74" rx="10" fill="#e3effc" stroke="#2a78d6"/><text x="837" y="68" text-anchor="middle">4 AI explanation</text><text x="837" y="90" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">plot · table · tool agent</text></g>
    <g><rect x="742" y="220" width="190" height="74" rx="10" fill="#ffffff" stroke="#c3c2b7"/><text x="837" y="252" text-anchor="middle">5 Claim extraction</text><text x="837" y="274" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">numeric · ranking · temporal · causal</text></g>
    <g><rect x="485" y="220" width="190" height="74" rx="10" fill="#e8f6e8" stroke="#0ca30c"/><text x="580" y="252" text-anchor="middle">6 Verifier</text><text x="580" y="274" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">tolerance-based, in code</text></g>
    <g><rect x="228" y="220" width="190" height="74" rx="10" fill="#e8f6e8" stroke="#0ca30c"/><text x="323" y="252" text-anchor="middle">7 Evidence report</text><text x="323" y="274" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">per-sentence verdict + proof</text></g>
  </g>
  <g stroke="#6b6a64" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M218 73H283"/><path d="M475 73H540"/><path d="M732 73H740"/><path d="M837 110V218"/><path d="M742 257H677"/><path d="M485 257H420"/>
  </g>
  <path d="M637 110V160H580V218" stroke="#6b6a64" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M380 110V160H323V218" stroke="#e0b341" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="590" y="186" font-size="11" fill="#52514e">computed values</text>
  <text x="333" y="186" font-size="11" fill="#52514e">QC flags</text>
</svg>

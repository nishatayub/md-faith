[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdfaith"
version = "0.1.0"
description = "MD-Faith: do LLM explanations of molecular dynamics analyses stay faithful to computed ground truth?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "MDAnalysis>=2.7",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "MDAnalysisTests"]

[project.scripts]
mdfaith = "mdfaith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

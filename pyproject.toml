[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdfaith"
version = "0.1.0"
description = "MD-Faith: do LLM explanations of molecular dynamics analyses stay faithful to computed ground truth?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "MDAnalysis>=2.7",
    "MDAnalysisTests",  # supplies the bundled public AdK trajectory used by the demo
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "httpx"]
api = ["fastapi", "uvicorn[standard]"]
llm = ["anthropic"]

[project.scripts]
mdfaith = "mdfaith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdfaith = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501", "E741", "RUF012", "RUF001", "RUF002", "RUF003"]
